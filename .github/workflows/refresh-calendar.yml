name: Refresh and publish field hockey calendar

on:
  workflow_dispatch:
  schedule:
    # 6:17 AM Eastern every day. Using :17 avoids the top-of-hour Actions rush.
    - cron: '17 6 * * *'
      timezone: "America/New_York"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "wl-field-hockey-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Scrape schedule and build calendar
        env:
          SOURCE_URL: "https://www.wlgeneralsathletics.com/fall-sports/field-hockey/"
          SEASON_YEAR: "2026"
          TIMEZONE: "America/New_York"
          MIN_EVENTS: "3"
          DEFAULT_DURATION_MINUTES: "120"
        run: python scrape_schedule.py

      - name: Upload scraper diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scraper-diagnostics
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep an audit copy in the repository
        run: |
          mkdir -p published
          cp site/wl-field-hockey.ics published/wl-field-hockey.ics
          cp debug/parsed.json published/last-parsed.json
          date -u +'%Y-%m-%dT%H:%M:%SZ' > published/last-successful-refresh.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh field hockey calendar"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
